name: reconcile
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsx scripts/reconcile-ledger.ts
        env:
          DATABASE_URL: ${{ secrets.RECONCILE_DATABASE_URL }}
